services:
  cprogrammingtest:
    build: .
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MAX_SOURCE_BYTES: 1048576
      COMPILE_TIMEOUT: 5
      RUN_TIMEOUT: 2
      MEMORY_LIMIT_MB: 128
      EXAM_DURATION_SECONDS: 5400
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
    restart: unless-stopped
