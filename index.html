<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C Programming Test</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#0b1020;color:#eef3ff}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center}.box,.card{background:#121a2d;border:1px solid #293653;border-radius:16px;padding:20px;box-shadow:0 15px 45px #0005}.login .box{width:380px}.login input{width:100%;padding:12px;margin:7px 0 12px;background:#0b1222;color:white;border:1px solid #293653;border-radius:9px}.primary{background:#4f8cff;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:bold}.top{height:60px;border-bottom:1px solid #293653;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#0b1020;z-index:4}.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}aside{padding:14px;border-right:1px solid #293653}.q{padding:11px;margin:7px 0;background:#111a30;border:1px solid #293653;border-radius:9px;cursor:pointer}.q.active{border-color:#4f8cff}.main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card h2{margin-top:0}.problem{line-height:1.7;white-space:pre-wrap}.editor{width:100%;height:420px;background:#070c17;color:#dce6ff;border:1px solid #293653;border-radius:10px;padding:14px;font:13px monospace;resize:vertical}.bar{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.result{margin-top:15px}.ok{color:#39d399}.bad{color:#ff657c}.muted{color:#91a0bf}.login h1{margin-bottom:5px}@media(max-width:850px){.app{grid-template-columns:1fr}aside{position:static}.grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="login"><div class="box"><h1>💻 C Programming Test</h1><p class="muted">ระบบสอบเขียนโปรแกรมภาษา C พร้อม Compiler</p><form id="lf"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="primary">เข้าสู่ระบบ</button></form><small class="muted">student / student123<br>admin / admin123</small><p id="le" class="bad"></p></div></div>
<div id="app" class="hidden"><header class="top"><b>💻 C Programming Test</b><span><span id="who"></span> <button id="logout">ออกจากระบบ</button></span></header><div class="app"><aside><b>ข้อสอบ</b><div id="qs"></div></aside><main class="main"><div class="grid"><section class="card"><h2 id="title"></h2><div id="problem" class="problem"></div></section><section class="card"><h2>Code Editor</h2><textarea id="code" class="editor">#include <stdio.h>\n\nint main(){\n    return 0;\n}</textarea><div class="bar"><label><input id="file" type="file" accept=".c" hidden> <button onclick="file.click()">Upload .c</button></label><button class="primary" id="submit">Compile & Submit</button></div><div id="result" class="result"></div></section></div></main></div></div>
<script>
let me=null,questions=[],current=1;const $=x=>document.getElementById(x);
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let j=await r.json();if(!r.ok)throw Error(j.error||"Error");return j}
async function init(){let j=await api("/api/me");if(j.user){me=j.user;show()}else $("login").classList.remove("hidden")}
function show(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=me.username+" ("+me.role+")";load()}
async function load(){questions=await api("/api/questions");$("qs").innerHTML=questions.map(q=>`<div class="q" id="q${q.id}" onclick="selectQ(${q.id})">ข้อ ${q.id} — ${q.title}</div>`).join("");selectQ(1)}
async function selectQ(id){current=id;document.querySelectorAll(".q").forEach(x=>x.classList.remove("active"));$("q"+id)?.classList.add("active");let q=await api("/api/questions/"+id);$("title").textContent="ข้อ "+id+": "+q.title;$("problem").textContent=q.body+"\n\nInput\n"+q.input+"\n\nOutput\n"+q.output+"\n\nSample Input\n"+q.sample_in+"\n\nSample Output\n"+q.sample_out+"\n\nคะแนน "+q.score}
$("lf").onsubmit=async e=>{e.preventDefault();try{let j=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("u").value,password:$("p").value})});me=j.user;show()}catch(e){$("le").textContent=e.message}}
$("logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()}
$("file").onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{$("code").value=r.result};r.readAsText(f)}}
$("submit").onclick=async()=>{let b=$("submit");b.disabled=true;b.textContent="กำลัง Compile...";try{let r=await api("/api/submit",{method:"POST",body:JSON.stringify({qid:current,code:$("code").value})});$("result").innerHTML=`<div class="card"><b class="${r.status==="ACCEPTED"?"ok":"bad"}">${r.status}</b><p>คะแนน: <b>${r.score}/10</b></p><p>Test Case: ${r.passed}/${r.total} ผ่าน</p>${r.error?`<pre class="bad">${r.error}</pre>`:""}</div>`}catch(e){$("result").innerHTML='<p class="bad">'+e.message+"</p>"}finally{b.disabled=false;b.textContent="Compile & Submit"}}
init()
</script></body></html>
